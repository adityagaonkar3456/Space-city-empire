<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Sci-Fi Story</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PREMIUM START SCREEN
    ========================== -->

    <div id="startScreen">

        <div class="logo">
            SCI-FI
        </div>

        <div class="subtitle">
            STORY
        </div>

        <p class="description">
            A new journey beyond Earth begins.
        </p>

        <button id="startButton">
            ▶ START GAME
        </button>

        <button id="loadButton">
            ↻ LOAD GAME
        </button>

        <div class="version">
            VERSION 1.0
        </div>

    </div>


    <!-- =========================
         GAME
    ========================== -->

    <canvas id="gameCanvas"></canvas>


    <!-- =========================
         HUD
    ========================== -->

    <div id="hud">

    <button id="menuButton">
        ☰ MENU
    </button>

    <div id="gameMenu">

        <button id="saveButton">
            💾 SAVE GAME
        </button>

        <button id="closeMenuButton">
            ✕ CLOSE
        </button>

    </div>

</div>


    <!-- =========================
         MOBILE CONTROLS
    ========================== -->

    <div id="mobileControls">

        <div id="movementControls">

            <button id="moveUp" class="controlButton">▲</button>

            <button id="moveLeft" class="controlButton">◀</button>

            <button id="moveDown" class="controlButton">▼</button>

            <button id="moveRight" class="controlButton">▶</button>

        </div>


        <div id="actionControls">

            <button id="runButton" class="actionButton">
                RUN
            </button>

            <button id="jumpButton" class="actionButton">
                JUMP
            </button>

        </div>

    </div>


    <script type="module" src="game.js"></script>

</body>
</html>
