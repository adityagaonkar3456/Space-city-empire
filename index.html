<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Space City Empire - Stage 1.1</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    touch-action: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#joystick {
    position: fixed;
    left: 25px;
    bottom: 30px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
    border: 2px solid rgba(255,255,255,0.35);
    z-index: 10;
}

#stick {
    position: absolute;
    left: 37px;
    top: 37px;
    width: 51px;
    height: 51px;
    border-radius: 50%;
    background: rgba(255,255,255,0.65);
    border: 2px solid rgba(255,255,255,0.9);
}

.controlButton {
    position: fixed;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    color: white;
    font-size: 13px;
    font-weight: bold;
    z-index: 10;
    background: rgba(0,0,0,0.35);
}

#run {
    right: 30px;
    bottom: 125px;
}

#jump {
    right: 115px;
    bottom: 35px;
}

#status {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 20;
    color: white;
    background: rgba(0,0,0,0.45);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
}

#cameraZone {
    position: fixed;
    right: 0;
    top: 0;
    width: 55%;
    height: 65%;
    z-index: 5;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="status">SPACE CITY EMPIRE • STAGE 1.1</div>

<div id="cameraZone"></div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="run" class="controlButton">RUN</button>
<button id="jump" class="controlButton">JUMP</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

/* =========================
   BASIC THREE.JS SETUP
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0.52, 0.78, 0.95);

scene.fog = new THREE.Fog(
    new THREE.Color(0.52, 0.78, 0.95),
    80,
    400
);

const camera = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 7, 12);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================
   LIGHTING
========================= */

const hemiLight = new THREE.HemisphereLight(
    0xffffff,
    0x667788,
    2.0
);

scene.add(hemiLight);


const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    100,
    150,
    80
);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

sun.shadow.camera.left = -150;
sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150;
sun.shadow.camera.bottom = -150;

scene.add(sun);


/* =========================
   GROUND
========================= */

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4f8a55,
        roughness: 0.9
    });

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    groundMaterial
);

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================
   ROADS
========================= */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x303238,
        roughness: 0.95
    });

function createRoad(
    x,
    z,
    width,
    depth
) {

    const road = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            0.08,
            depth
        ),
        roadMaterial
    );

    road.position.set(
        x,
        0.04,
        z
    );

    road.receiveShadow = true;

    scene.add(road);
}

createRoad(0, 0, 500, 18);
createRoad(0, 60, 500, 18);
createRoad(60, 0, 18, 500);
createRoad(-60, 0, 18, 500);


/* =========================
   BUILDINGS
========================= */

const buildings = [];

function createBuilding(
    x,
    z,
    width,
    height,
    depth
) {

    const material =
        new THREE.MeshStandardMaterial({
            color:
                new THREE.Color(
                    0.25 +
                    Math.random() * 0.25,

                    0.30 +
                    Math.random() * 0.25,

                    0.40 +
                    Math.random() * 0.25
                ),

            roughness: 0.7,
            metalness: 0.1
        });

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        material
    );

    building.position.set(
        x,
        height / 2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);

    buildings.push({
        mesh: building,
        x: x,
        z: z,
        width: width,
        depth: depth
    });
}


/* City blocks */

for (let x = -150; x <= 150; x += 30) {

    for (let z = -150; z <= 150; z += 30) {

        const nearRoadX =
            Math.abs(x % 60) < 15;

        const nearRoadZ =
            Math.abs(z % 60) < 15;

        if (
            nearRoadX ||
            nearRoadZ
        ) {
            continue;
        }

        const width =
            15 + Math.random() * 8;

        const depth =
            15 + Math.random() * 8;

        const height =
            10 + Math.random() * 45;

        createBuilding(
            x,
            z,
            width,
            height,
            depth
        );
    }
}


/* =========================
   PLAYER
========================= */

const player = new THREE.Group();

scene.add(player);

player.position.set(
    0,
    0,
    20
);


/* Body */

const body = new THREE.Mesh(
    new THREE.BoxGeometry(
        1.2,
        1.8,
        0.7
    ),

    new THREE.MeshStandardMaterial({
        color: 0x2468a8,
        roughness: 0.65
    })
);

body.position.y = 1.4;

body.castShadow = true;

player.add(body);


/* Head */

const head = new THREE.Mesh(
    new THREE.SphereGeometry(
        0.48,
        16,
        16
    ),

    new THREE.MeshStandardMaterial({
        color: 0xc98c62,
        roughness: 0.8
    })
);

head.position.y = 2.65;

head.castShadow = true;

player.add(head);


/* =========================
   PLAYER PHYSICS
========================= */

let velocityY = 0;

let isGrounded = true;

const gravity = -18;

const jumpPower = 7;

const playerRadius = 0.8;


/* =========================
   JOYSTICK
========================= */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joystickX = 0;
let joystickY = 0;

let joystickActive = false;

function updateJoystick(
    clientX,
    clientY
) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        clientX - centerX;

    let dy =
        clientY - centerY;

    const maxDistance = 38;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (distance > maxDistance) {

        dx =
            dx / distance *
            maxDistance;

        dy =
            dy / distance *
            maxDistance;
    }

    joystickX =
        dx / maxDistance;

    joystickY =
        dy / maxDistance;

    stick.style.transform =
        `translate(${dx}px, ${dy}px)`;
}


function resetJoystick() {

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform =
        "translate(0px, 0px)";
}


joystick.addEventListener(
    "pointerdown",
    e => {

        joystickActive = true;

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);


window.addEventListener(
    "pointermove",
    e => {

        if (!joystickActive)
            return;

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);


window.addEventListener(
    "pointerup",
    resetJoystick
);


/* =========================
   RUN BUTTON
========================= */

const runButton =
    document.getElementById("run");

let running = false;

runButton.addEventListener(
    "pointerdown",
    () => {
        running = true;
    }
);

window.addEventListener(
    "pointerup",
    () => {
        running = false;
    }
);


/* =========================
   JUMP
========================= */

const jumpButton =
    document.getElementById("jump");

function jump() {

    if (!isGrounded)
        return;

    velocityY =
        jumpPower;

    isGrounded = false;
}

jumpButton.addEventListener(
    "pointerdown",
    jump
);


/* =========================
   CAMERA ROTATION
========================= */

let cameraYaw = 0;

let cameraPitch = 0.35;

let cameraTouch = false;

let lastTouchX = 0;
let lastTouchY = 0;


const cameraZone =
    document.getElementById(
        "cameraZone"
    );


cameraZone.addEventListener(
    "pointerdown",
    e => {

        cameraTouch = true;

        lastTouchX =
            e.clientX;

        lastTouchY =
            e.clientY;
    }
);


window.addEventListener(
    "pointermove",
    e => {

        if (!cameraTouch)
            return;

        if (
            e.clientX <
            window.innerWidth * 0.45
        ) {
            return;
        }

        const dx =
            e.clientX -
            lastTouchX;

        const dy =
            e.clientY -
            lastTouchY;

        cameraYaw -=
            dx * 0.006;

        cameraPitch -=
            dy * 0.004;

        cameraPitch =
            THREE.MathUtils.clamp(
                cameraPitch,
                0.1,
                0.9
            );

        lastTouchX =
            e.clientX;

        lastTouchY =
            e.clientY;
    }
);


window.addEventListener(
    "pointerup",
    () => {
        cameraTouch = false;
    }
);


/* =========================
   COLLISION
========================= */

function checkCollision(
    nextX,
    nextZ
) {

    for (
        const building
        of buildings
    ) {

        const halfW =
            building.width / 2;

        const halfD =
            building.depth / 2;

        const closestX =
            Math.max(
                building.x - halfW,
                Math.min(
                    nextX,
                    building.x + halfW
                )
            );

        const closestZ =
            Math.max(
                building.z - halfD,
                Math.min(
                    nextZ,
                    building.z + halfD
                )
            );

        const dx =
            nextX - closestX;

        const dz =
            nextZ - closestZ;

        const distanceSquared =
            dx * dx +
            dz * dz;

        if (
            distanceSquared <
            playerRadius *
            playerRadius
        ) {

            return true;
        }
    }

    return false;
}


/* =========================
   MOVEMENT
========================= */

const clock =
    new THREE.Clock();

function updatePlayer(
    delta
) {

    let moveX = joystickX;
    let moveZ = joystickY;

    const inputStrength =
        Math.sqrt(
            moveX * moveX +
            moveZ * moveZ
        );

    if (
        inputStrength <
        0.05
    ) {
        moveX = 0;
        moveZ = 0;
    }


    const speed =
        running
        ? 12
        : 5.5;


    /*
      Camera-relative movement
    */

    const sin =
        Math.sin(cameraYaw);

    const cos =
        Math.cos(cameraYaw);


    const worldX =
        moveX * cos -
        moveZ * sin;

    const worldZ =
        moveX * sin +
        moveZ * cos;


    const nextX =
        player.position.x +
        worldX *
        speed *
        delta;

    const nextZ =
        player.position.z +
        worldZ *
        speed *
        delta;


    /*
      Collision check
    */

    if (
        !checkCollision(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    if (
        !checkCollision(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    /*
      Face movement direction
    */

    if (
        inputStrength >
        0.05
    ) {

        const targetRotation =
            Math.atan2(
                worldX,
                worldZ
            );

        player.rotation.y =
            THREE.MathUtils.lerp(
                player.rotation.y,
                targetRotation,
                0.15
            );
    }


    /*
      Gravity
    */

    velocityY +=
        gravity *
        delta;

    player.position.y +=
        velocityY *
        delta;


    /*
      Ground
    */

    if (
        player.position.y <= 0
    ) {

        player.position.y = 0;

        velocityY = 0;

        isGrounded = true;
    }
}


/* =========================
   THIRD PERSON CAMERA
========================= */

function updateCamera() {

    const distance = 10;

    const height = 5.5;


    const targetX =
        player.position.x -
        Math.sin(cameraYaw) *
        distance;

    const targetZ =
        player.position.z -
        Math.cos(cameraYaw) *
        distance;

    const targetY =
        player.position.y +
        height +
        cameraPitch * 3;


    camera.position.x =
        THREE.MathUtils.lerp(
            camera.position.x,
            targetX,
            0.08
        );

    camera.position.y =
        THREE.MathUtils.lerp(
            camera.position.y,
            targetY,
            0.08
        );

    camera.position.z =
        THREE.MathUtils.lerp(
            camera.position.z,
            targetZ,
            0.08
        );


    const lookTarget =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 1.5,
            player.position.z
        );

    camera.lookAt(
        lookTarget
    );
}


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );

    updatePlayer(delta);

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================
   START GAME
========================= */

animate();

</script>

</body>
</html>
