<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Space City Empire</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#status{
  position:fixed;
  top:12px;
  left:12px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.55);
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:120px;
  height:120px;
  border-radius:50%;
  background:rgba(0,0,0,.25);
  border:2px solid rgba(255,255,255,.5);
  z-index:10;
}

#stick{
  position:absolute;
  width:50px;
  height:50px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
}

.btn{
  position:fixed;
  z-index:10;
  width:75px;
  height:75px;
  border-radius:50%;
  border:2px solid white;
  background:rgba(0,0,0,.4);
  color:white;
  font-weight:bold;
}

#run{
  right:25px;
  bottom:120px;
}

#jump{
  right:110px;
  bottom:25px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="status">
SPACE CITY EMPIRE • CANVAS
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="run" class="btn">RUN</button>
<button id="jump" class="btn">JUMP</button>

<script>

const canvas =
document.createElement("canvas");

document
.getElementById("game")
.appendChild(canvas);

const ctx =
canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

  W = canvas.width =
      window.innerWidth;

  H = canvas.height =
      window.innerHeight;
}

resize();

window.addEventListener(
"resize",
resize
);


/* =====================
   WORLD
===================== */

const player = {
  x:0,
  z:20,
  y:0,
  vy:0,
  angle:0
};

let cameraX = 0;
let cameraZ = 0;

let joyX = 0;
let joyY = 0;

let running = false;

let grounded = true;

const gravity = -18;
const jumpPower = 7;


/* =====================
   BUILDINGS
===================== */

const buildings = [];

for(
  let x=-180;
  x<=180;
  x+=40
){

  for(
    let z=-180;
    z<=180;
    z+=40
  ){

    if(
      Math.abs(x)<30 &&
      Math.abs(z)<30
    ){
      continue;
    }

    buildings.push({

      x:x,
      z:z,

      width:
        18 + Math.random()*8,

      depth:
        18 + Math.random()*8,

      height:
        20 + Math.random()*50
    });
  }
}


/* =====================
   WORLD TO SCREEN
===================== */

function worldToScreen(
  x,
  z,
  y=0
){

  const scale = 7;

  const sx =
    W/2 +
    (x-cameraX)*scale;

  const sy =
    H/2 +
    (z-cameraZ)*scale*0.45 -
    y*scale;

  return {
    x:sx,
    y:sy
  };
}


/* =====================
   DRAW CITY
===================== */

function drawCity(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /* Sky */

  const sky =
    ctx.createLinearGradient(
      0,0,0,H
    );

  sky.addColorStop(
    0,
    "#5db7ed"
  );

  sky.addColorStop(
    1,
    "#d9f3ff"
  );

  ctx.fillStyle = sky;

  ctx.fillRect(
    0,0,W,H
  );


  /* Ground */

  ctx.fillStyle =
    "#4d914f";

  ctx.fillRect(
    0,
    H/2,
    W,
    H/2
  );


  /* Roads */

  const roadWidth =
    18;

  const p1 =
    worldToScreen(
      -250,
      0
    );

  const p2 =
    worldToScreen(
      250,
      0
    );

  ctx.strokeStyle =
    "#303030";

  ctx.lineWidth =
    roadWidth * 7;

  ctx.beginPath();

  ctx.moveTo(
    p1.x,
    p1.y
  );

  ctx.lineTo(
    p2.x,
    p2.y
  );

  ctx.stroke();


  const v1 =
    worldToScreen(
      0,
      -250
    );

  const v2 =
    worldToScreen(
      0,
      250
    );

  ctx.beginPath();

  ctx.moveTo(
    v1.x,
    v1.y
  );

  ctx.lineTo(
    v2.x,
    v2.y
  );

  ctx.stroke();


  /* Buildings */

  for(
    const b of buildings
  ){

    const p =
      worldToScreen(
        b.x,
        b.z,
        0
      );

    const width =
      b.width * 7;

    const height =
      b.height * 7;

    const depth =
      b.depth * 3.2;


    ctx.fillStyle =
      "#626b78";

    ctx.fillRect(
      p.x-width/2,
      p.y-height,
      width,
      height
    );


    /* Building top */

    ctx.fillStyle =
      "#87909b";

    ctx.beginPath();

    ctx.moveTo(
      p.x-width/2,
      p.y-height
    );

    ctx.lineTo(
      p.x-width/2+depth,
      p.y-height-depth/2
    );

    ctx.lineTo(
      p.x+width/2+depth,
      p.y-height-depth/2
    );

    ctx.lineTo(
      p.x+width/2,
      p.y-height
    );

    ctx.closePath();

    ctx.fill();


    /* Windows */

    ctx.fillStyle =
      "#d8e7ed";

    const rows =
      Math.min(
        8,
        Math.floor(
          b.height/7
        )
      );

    for(
      let r=0;
      r<rows;
      r++
    ){

      const wy =
        p.y -
        height +
        15 +
        r*32;

      for(
        let c=-1;
        c<=1;
        c++
      ){

        ctx.fillRect(
          p.x+c*35-5,
          wy,
          10,
          15
        );
      }
    }
  }


  /* Player shadow */

  const shadow =
    worldToScreen(
      player.x,
      player.z,
      0
    );

  ctx.fillStyle =
    "rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    shadow.x,
    shadow.y,
    18,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Player */

  const pp =
    worldToScreen(
      player.x,
      player.z,
      player.y
    );


  /* Body */

  ctx.fillStyle =
    "#2474b8";

  ctx.fillRect(
    pp.x-16,
    pp.y-55,
    32,
    45
  );


  /* Head */

  ctx.fillStyle =
    "#c98c62";

  ctx.beginPath();

  ctx.arc(
    pp.x,
    pp.y-70,
    13,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* Player direction */

  ctx.strokeStyle =
    "white";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
    pp.x,
    pp.y-35
  );

  ctx.lineTo(
    pp.x +
    Math.sin(player.angle)*25,
    pp.y-35 +
    Math.cos(player.angle)*25
  );

  ctx.stroke();
}


/* =====================
   COLLISION
===================== */

function collision(
  x,
  z
){

  for(
    const b of buildings
  ){

    const halfW =
      b.width/2;

    const halfD =
      b.depth/2;

    if(
      x > b.x-halfW-1 &&
      x < b.x+halfW+1 &&
      z > b.z-halfD-1 &&
      z < b.z+halfD+1
    ){

      return true;
    }
  }

  return false;
}


/* =====================
   PLAYER UPDATE
===================== */

function update(
  dt
){

  const speed =
    running
    ? 12
    : 5;


  let dx = joyX;
  let dz = joyY;


  const length =
    Math.sqrt(
      dx*dx+
      dz*dz
    );


  if(length > 1){

    dx/=length;
    dz/=length;
  }


  const nx =
    player.x +
    dx*speed*dt;

  const nz =
    player.z +
    dz*speed*dt;


  if(
    !collision(
      nx,
      player.z
    )
  ){

    player.x = nx;
  }


  if(
    !collision(
      player.x,
      nz
    )
  ){

    player.z = nz;
  }


  if(
    Math.abs(dx)+
    Math.abs(dz)>0.05
  ){

    player.angle =
      Math.atan2(
        dx,
        dz
      );
  }


  /* Gravity */

  player.vy +=
    gravity*dt;

  player.y +=
    player.vy*dt;


  if(
    player.y<=0
  ){

    player.y=0;

    player.vy=0;

    grounded=true;
  }


  /* Camera */

  cameraX +=
    (player.x-cameraX)*
    0.08;

  cameraZ +=
    (player.z-cameraZ)*
    0.08;
}


/* =====================
   JOYSTICK
===================== */

const joystick =
document.getElementById(
  "joystick"
);

const stick =
document.getElementById(
  "stick"
);

let joystickActive=false;


function moveJoystick(
  x,
  y
){

  const rect =
    joystick.getBoundingClientRect();

  const cx =
    rect.left+
    rect.width/2;

  const cy =
    rect.top+
    rect.height/2;

  let dx =
    x-cx;

  let dy =
    y-cy;

  const max=35;

  const d =
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  if(d>max){

    dx =
      dx/d*max;

    dy =
      dy/d*max;
  }

  joyX =
    dx/max;

  joyY =
    dy/max;

  stick.style.transform =
    `translate(${dx}px,${dy}px)`;
}


joystick.addEventListener(
  "pointerdown",
  e=>{

    joystickActive=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    moveJoystick(
      e.clientX,
      e.clientY
    );
  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(!joystickActive)
      return;

    moveJoystick(
      e.clientX,
      e.clientY
    );
  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);


joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


function resetJoystick(){

  joystickActive=false;

  joyX=0;
  joyY=0;

  stick.style.transform =
    "translate(0,0)";
}


/* =====================
   RUN
===================== */

const runButton =
document.getElementById(
  "run"
);

runButton.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    running=true;
  }
);

runButton.addEventListener(
  "pointerup",
  ()=>{

    running=false;
  }
);

runButton.addEventListener(
  "pointercancel",
  ()=>{

    running=false;
  }
);


/* =====================
   JUMP
===================== */

const jumpButton =
document.getElementById(
  "jump"
);

jumpButton.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(grounded){

      player.vy =
        jumpPower;

      grounded=false;
    }
  }
);


/* =====================
   GAME LOOP
===================== */

let last =
performance.now();


function gameLoop(
  now
){

  const dt =
    Math.min(
      (now-last)/1000,
      0.05
    );

  last=now;

  update(dt);

  drawCity();

  requestAnimationFrame(
    gameLoop
  );
}


requestAnimationFrame(
  gameLoop
);


/* =====================
   READY
===================== */

document.getElementById(
  "status"
).textContent =
"SPACE CITY EMPIRE • READY";

</script>

</body>
</html>
