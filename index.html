<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Sci-Fi Story Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Game HUD -->
    <div id="hud">
        <div id="gameTitle">
            SCI-FI STORY
        </div>

        <div id="gameStatus">
            Loading...
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobileControls">

        <div id="movementControls">

            <button id="moveUp" class="controlButton">
                ▲
            </button>

            <button id="moveLeft" class="controlButton">
                ◀
            </button>

            <button id="moveDown" class="controlButton">
                ▼
            </button>

            <button id="moveRight" class="controlButton">
                ▶
            </button>

        </div>

        <div id="actionControls">

            <button id="runButton" class="actionButton">
                RUN
            </button>

            <button id="jumpButton" class="actionButton">
                JUMP
            </button>

        </div>

    </div>

    <!-- Game Script -->
    <script type="module" src="game.js"></script>

</body>
</html>
