<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Space City Empire</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
}

#status {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 20;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(0,0,0,.55);
  color: white;
  font-size: 13px;
}

#joystick {
  position: fixed;
  left: 25px;
  bottom: 25px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(0,0,0,.25);
  border: 2px solid rgba(255,255,255,.5);
  z-index: 20;
}

#stick {
  position: absolute;
  width: 50px;
  height: 50px;
  left: 33px;
  top: 33px;
  border-radius: 50%;
  background: rgba(255,255,255,.8);
}

.btn {
  position: fixed;
  z-index: 20;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 2px solid white;
  color: white;
  background: rgba(0,0,0,.4);
  font-weight: bold;
}

#run {
  right: 25px;
  bottom: 120px;
}

#jump {
  right: 110px;
  bottom: 25px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="status">
  SPACE CITY EMPIRE • REPAIR 1.1
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="run" class="btn">RUN</button>
<button id="jump" class="btn">JUMP</button>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

console.log("Game script started");

if (typeof THREE === "undefined") {

  document.getElementById("status").textContent =
    "ERROR: Three.js failed to load";

} else {

  /* =========================
     SCENE
  ========================= */

  const scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x87ceeb);


  /* =========================
     CAMERA
  ========================= */

  const camera =
    new THREE.PerspectiveCamera(
      60,
      window.innerWidth /
      window.innerHeight,
      0.1,
      1000
    );

  camera.position.set(
    0, 6, 10
  );


  /* =========================
     RENDERER
  ========================= */

  const renderer =
    new THREE.WebGLRenderer({
      antialias: true
    });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      1.5
    )
  );

  document
    .getElementById("game")
    .appendChild(renderer.domElement);


  /* =========================
     LIGHT
  ========================= */

  const ambient =
    new THREE.AmbientLight(
      0xffffff,
      2
    );

  scene.add(ambient);


  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      2
    );

  sun.position.set(
    50,
    100,
    50
  );

  scene.add(sun);


  /* =========================
     GROUND
  ========================= */

  const ground =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        300,
        300
      ),
      new THREE.MeshStandardMaterial({
        color: 0x4d914f
      })
    );

  ground.rotation.x =
    -Math.PI / 2;

  scene.add(ground);


  /* =========================
     ROADS
  ========================= */

  const roadMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x303030
    });


  function road(
    x,
    z,
    width,
    depth
  ) {

    const r =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          width,
          0.1,
          depth
        ),
        roadMaterial
      );

    r.position.set(
      x,
      0.05,
      z
    );

    scene.add(r);
  }


  road(
    0,
    0,
    300,
    18
  );

  road(
    0,
    60,
    300,
    18
  );

  road(
    60,
    0,
    18,
    300
  );

  road(
    -60,
    0,
    18,
    300
  );


  /* =========================
     BUILDINGS
  ========================= */

  function building(
    x,
    z,
    h
  ) {

    const b =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          18,
          h,
          18
        ),
        new THREE.MeshStandardMaterial({
          color: 0x707783
        })
      );

    b.position.set(
      x,
      h / 2,
      z
    );

    scene.add(b);
  }


  for (
    let x = -120;
    x <= 120;
    x += 40
  ) {

    for (
      let z = -120;
      z <= 120;
      z += 40
    ) {

      if (
        Math.abs(x) < 25 &&
        Math.abs(z) < 25
      ) {
        continue;
      }

      building(
        x,
        z,
        10 +
        Math.random() * 30
      );
    }
  }


  /* =========================
     PLAYER
  ========================= */

  const player =
    new THREE.Group();

  scene.add(player);

  player.position.set(
    0,
    0,
    20
  );


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.2,
        1.8,
        0.7
      ),
      new THREE.MeshStandardMaterial({
        color: 0x2474b8
      })
    );

  body.position.y = 1.4;

  player.add(body);


  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.5,
        16,
        16
      ),
      new THREE.MeshStandardMaterial({
        color: 0xc98c62
      })
    );

  head.position.y = 2.65;

  player.add(head);


  /* =========================
     MOVEMENT
  ========================= */

  let joyX = 0;
  let joyY = 0;

  let running = false;

  let velocityY = 0;

  let grounded = true;


  const gravity = -18;
  const jumpPower = 7;


  /* =========================
     JOYSTICK
  ========================= */

  const joystick =
    document.getElementById(
      "joystick"
    );

  const stick =
    document.getElementById(
      "stick"
    );


  let joyActive = false;


  function joystickMove(
    x,
    y
  ) {

    const rect =
      joystick.getBoundingClientRect();

    const cx =
      rect.left +
      rect.width / 2;

    const cy =
      rect.top +
      rect.height / 2;

    let dx = x - cx;
    let dy = y - cy;

    const max = 35;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if (
      distance > max
    ) {

      dx =
        dx / distance * max;

      dy =
        dy / distance * max;
    }

    joyX =
      dx / max;

    joyY =
      dy / max;

    stick.style.transform =
      "translate(" +
      dx +
      "px," +
      dy +
      "px)";
  }


  joystick.addEventListener(
    "pointerdown",
    function(e) {

      joyActive = true;

      joystickMove(
        e.clientX,
        e.clientY
      );
    }
  );


  window.addEventListener(
    "pointermove",
    function(e) {

      if (!joyActive)
        return;

      joystickMove(
        e.clientX,
        e.clientY
      );
    }
  );


  window.addEventListener(
    "pointerup",
    function() {

      joyActive = false;

      joyX = 0;
      joyY = 0;

      stick.style.transform =
        "translate(0,0)";
    }
  );


  /* =========================
     RUN
  ========================= */

  const run =
    document.getElementById(
      "run"
    );

  run.addEventListener(
    "pointerdown",
    function() {
      running = true;
    }
  );

  run.addEventListener(
    "pointerup",
    function() {
      running = false;
    }
  );


  /* =========================
     JUMP
  ========================= */

  const jump =
    document.getElementById(
      "jump"
    );

  jump.addEventListener(
    "pointerdown",
    function() {

      if (!grounded)
        return;

      velocityY =
        jumpPower;

      grounded = false;
    }
  );


  /* =========================
     GAME LOOP
  ========================= */

  let previous =
    performance.now();


  function animate(
    now
  ) {

    requestAnimationFrame(
      animate
    );

    let delta =
      (now - previous) /
      1000;

    previous = now;

    delta =
      Math.min(
        delta,
        0.05
      );


    /* Movement */

    const speed =
      running
      ? 10
      : 5;


    player.position.x +=
      joyX *
      speed *
      delta;

    player.position.z +=
      joyY *
      speed *
      delta;


    /* Gravity */

    velocityY +=
      gravity *
      delta;

    player.position.y +=
      velocityY *
      delta;


    if (
      player.position.y <= 0
    ) {

      player.position.y = 0;

      velocityY = 0;

      grounded = true;
    }


    /* Camera */

    const cameraX =
      player.position.x;

    const cameraY =
      player.position.y + 6;

    const cameraZ =
      player.position.z + 10;


    camera.position.lerp(
      new THREE.Vector3(
        cameraX,
        cameraY,
        cameraZ
      ),
      0.08
    );


    camera.lookAt(
      player.position.x,
      player.position.y + 1.3,
      player.position.z
    );


    renderer.render(
      scene,
      camera
    );
  }


  requestAnimationFrame(
    animate
  );


  /* =========================
     RESIZE
  ========================= */

  window.addEventListener(
    "resize",
    function() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }
  );


  document.getElementById(
    "status"
  ).textContent =
    "SPACE CITY EMPIRE • READY";

}

</script>

</body>
</html>
